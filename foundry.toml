[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "@openzeppelin/contracts@5.3.0/=node_modules/@openzeppelin/contracts/", "@ccip/=vendor/ccip/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./vendor" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 32
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
op_sepolia = "${OP_SEPOLIA_RPC_URL}"
