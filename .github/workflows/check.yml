name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:ui
      - run: forge test --fuzz-seed 0x6d756d626169
        env:
          FOUNDRY_FUZZ_RUNS: '10000'
          FOUNDRY_INVARIANT_RUNS: '1024'
          FOUNDRY_INVARIANT_DEPTH: '128'
      - run: npm run build
      - run: forge lint contracts/src/crosschain --severity high
      - run: npm run check:public-build
